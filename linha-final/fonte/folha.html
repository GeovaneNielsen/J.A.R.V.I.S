<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #e8eef3; font-family: "DejaVu Sans", Arial, sans-serif; color: #1b1b22; }
  .sheet { width: 1360px; padding: 36px 40px 44px; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: 2px; }
  h1 small { font-size: 20px; letter-spacing: 1px; color: #5a6470; font-weight: normal; margin-left: 12px; }
  .sub { margin: 0 0 24px; color: #5a6470; font-size: 17px; }
  .grid { display: grid; gap: 18px; }
  .chars { grid-template-columns: repeat(4, 1fr); }
  .items { grid-template-columns: repeat(3, 1fr); }
  .card { background: #fff; border: 3px solid #1b1b22; border-radius: 16px; padding: 14px 14px 16px; display: grid; justify-items: center; gap: 6px; }
  .card.wide { grid-column: span 2; }
  .card svg { width: 100%; height: auto; }
  .name { font-weight: bold; font-size: 21px; }
  .role { font-size: 15px; color: #5a6470; text-align: center; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1b1b22; vertical-align: -2px; margin-right: 6px; }
</style></head>
<body>

    ${back}
    <rect x="72" y="262" width="24" height="60" rx="8" fill="${pants}"/><rect x="104" y="262" width="24" height="60" rx="8" fill="${pants}"/>

    ${torso}

    ${headBack}
    ${head ? `<circle cx="100" cy="98" r="52" fill="${skin}"/>` : ""}
    ${hair}
    ${face}
    ${front}`);
}

function sheet(title, sub, cls, list) {
  return `<h1>LINHA FINAL<small>${title}</small></h1><p class="sub">${sub}</p>
  <div class="grid ${cls}">${list.map((c) => `<div class="card${c.wide ? " wide" : ""}">${c.art}<div class="name">${c.color ? `<span class="chip" style="background:${c.color}"></span>` : ""}${c.name}</div><div class="role">${c.role}</div></div>`).join("")}</div>`;
}

</body></html>
