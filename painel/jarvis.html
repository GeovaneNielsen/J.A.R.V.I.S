<title>J.A.R.V.I.S.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen, HUD band on top, the reactor core in the middle, the spoken reply and the command bar at the bottom. Deliberately dark-only. */
:root {
  --void: #03070c;
  --panel: #07121b;
  --line: #12324a;
  --ice: #8de8ff;
  --ice-dim: #4c9fbd;
  --ember: #ffb35c;
  --text: #d9f3fb;
  --muted: #7aa3b5;
  --danger: #ff7a6b;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 42%, #08202f 0%, var(--void) 62%) var(--void);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void);
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto auto;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 14px;
  max-width: 560px;
  margin: 0 auto;
  box-sizing: border-box;
}

/* HUD band */
.hud {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 4px 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.brand {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: 0.32em;
  font-size: 13px;
  color: var(--ice);
}
.meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.clock {
  grid-row: 1 / span 2;
  grid-column: 2;
  font-family: var(--display);
  font-weight: 500;
  font-size: 34px;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* Reactor stage */
.stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
}
#core {
  width: min(100%, 46vh, 420px);
  aspect-ratio: 1;
  max-width: 100%;
  display: block;
}
.core-hit {
  position: absolute;
  inset: 0;
  margin: auto;
  width: min(44%, 20vh, 180px);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-content: center;
  gap: 4px;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.core-hit:focus-visible { outline: 1px dashed var(--ice); outline-offset: 6px; }
#stateLabel {
  font-family: var(--display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.28em;
  color: var(--ice);
  text-shadow: 0 0 12px rgba(141, 232, 255, 0.55);
}
#stateHint {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0;
}
body[data-state="speaking"] #stateLabel { color: var(--ember); text-shadow: 0 0 12px rgba(255, 179, 92, 0.55); }

/* Status chips */
.chips {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.chip {
  border: 1px solid var(--line);
  background: rgba(7, 18, 27, 0.7);
  padding: 8px 10px;
  display: grid;
  gap: 2px;
  min-width: 0;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
}
.chip b {
  font-family: var(--display);
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--ice-dim);
}
.chip span {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip button {
  justify-self: start;
  margin-top: 2px;
  font: 500 11px var(--display);
  letter-spacing: 0.1em;
  color: var(--void);
  background: var(--ice);
  border: 0;
  padding: 4px 8px;
  cursor: pointer;
}

/* Spoken reply */
.log {
  display: grid;
  gap: 6px;
  min-height: 0;
  max-height: 26vh;
  overflow-y: auto;
  padding-right: 2px;
}
.you {
  margin: 0;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}
.you::before { content: "SENHOR › "; color: var(--ice-dim); }
.reply {
  margin: 0;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  text-wrap: pretty;
}
.reply.error { color: var(--danger); }
.reply.thinking { color: var(--muted); font-style: italic; }

/* Command bar */
.bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}
.bar input {
  min-width: 0;
  height: 46px;
  box-sizing: border-box;
  padding: 0 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: 16px var(--body);
  border-radius: 23px;
}
.bar input::placeholder { color: var(--muted); }
.bar input:focus-visible { outline: none; border-color: var(--ice-dim); box-shadow: 0 0 0 3px rgba(141, 232, 255, 0.12); }
.round {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ice);
  display: grid; place-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.round:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.round svg { width: 20px; height: 20px; }
#micBtn[aria-pressed="true"] { background: var(--ice); color: var(--void); box-shadow: 0 0 18px rgba(141, 232, 255, 0.5); }
#sendBtn { background: var(--ice); color: var(--void); border-color: var(--ice); }
#sendBtn:disabled { opacity: 0.4; cursor: default; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  justify-content: center;
}
.controls button {
  border: 0;
  background: none;
  color: var(--muted);
  font: 500 11px var(--display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 4px 2px;
  cursor: pointer;
}
.controls button:hover, .controls button:focus-visible { color: var(--ice); outline: none; }
.controls button[aria-pressed="false"] { text-decoration: line-through; }
.hint {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin: 0;
}

@media (max-height: 640px) {
  .clock { font-size: 26px; }
  .log { max-height: 20vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <header class="hud">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="meta" id="dateLine">Curitiba</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <section class="stage" aria-label="Núcleo do JARVIS">
    <canvas id="core" aria-hidden="true"></canvas>
    <button class="core-hit" id="coreHit" type="button" aria-label="Falar com o JARVIS">
      <span id="stateLabel">EM ESPERA</span>
      <small id="stateHint">toque para falar</small>
    </button>
  </section>

  <section class="chips" aria-label="Situação">
    <div class="chip" id="chipAgenda">
      <b>AGENDA · HOJE</b>
      <span id="agendaText">Consultando o Google Calendar…</span>
      <button type="button" id="agendaBtn" hidden>Ler agenda</button>
    </div>
    <div class="chip">
      <b>VOZ</b>
      <span id="voiceText">Português do Brasil</span>
    </div>
  </section>

  <section class="log" id="log" aria-live="polite">
    <p class="you" id="youLine" hidden></p>
    <p class="reply" id="replyLine">Às suas ordens, senhor. Toque no núcleo ou no microfone e fale; eu respondo em voz alta.</p>
  </section>

  <form class="bar" id="bar" autocomplete="off">
    <button class="round" type="button" id="micBtn" aria-pressed="false" aria-label="Ditar por voz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="msg" name="msg" type="text" enterkeyhint="send" placeholder="Fale ou escreva, senhor…" aria-label="Mensagem para o JARVIS">
    <button class="round" type="submit" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="controls">
    <button type="button" id="muteBtn" aria-pressed="true">Som</button>
    <button type="button" id="voiceBtn">Trocar voz</button>
    <button type="button" id="copyBtn">Copiar resposta</button>
    <button type="button" id="stopBtn" hidden>Parar</button>
  </div>
  <p class="hint" id="hint" hidden></p>
</div>

<script>
(() => {
  const TZ = "America/Sao_Paulo";
  const $ = (id) => document.getElementById(id);
  const els = {
    clock: $("clock"), dateLine: $("dateLine"), core: $("core"), coreHit: $("coreHit"),
    stateLabel: $("stateLabel"), stateHint: $("stateHint"), agendaText: $("agendaText"), agendaBtn: $("agendaBtn"),
    voiceText: $("voiceText"), youLine: $("youLine"), replyLine: $("replyLine"), log: $("log"),
    bar: $("bar"), msg: $("msg"), micBtn: $("micBtn"), sendBtn: $("sendBtn"),
    muteBtn: $("muteBtn"), voiceBtn: $("voiceBtn"), copyBtn: $("copyBtn"), stopBtn: $("stopBtn"), hint: $("hint"),
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Clock ---------- */
  const fmtTime = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  const fmtDate = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" });
  const fmtFull = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const isoDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  function tick() {
    const now = new Date();
    els.clock.textContent = fmtTime.format(now);
    els.dateLine.textContent = fmtDate.format(now).replace(".", "") + " · Curitiba";
  }
  tick();
  setInterval(tick, 15000);

  /* ---------- State ---------- */
  let state = "idle";
  const labels = {
    idle: ["EM ESPERA", "toque para falar"],
    listening: ["OUVINDO", "fale, senhor"],
    thinking: ["PROCESSANDO", "um instante"],
    speaking: ["FALANDO", "toque para interromper"],
  };
  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    els.stateLabel.textContent = labels[s][0];
    els.stateHint.textContent = labels[s][1];
    els.stopBtn.hidden = !(s === "thinking" || s === "speaking");
  }
  setState("idle");

  /* ---------- Reactor core (canvas) ---------- */
  const cv = els.core, ctx = cv.getContext("2d");
  let level = 0.15, bump = 0;
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  new ResizeObserver(resize).observe(cv);
  resize();
  const ICE = "141,232,255", EMBER = "255,179,92";
  function frame(ms) {
    const t = ms / 1000;
    const speed = reduceMotion ? 0.2 : 1;
    const w = cv.width, h = cv.height, cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 * 0.94;
    let target;
    if (state === "speaking") target = 0.55 + 0.35 * Math.abs(Math.sin(t * 7.3)) * (0.6 + 0.4 * Math.sin(t * 2.1));
    else if (state === "listening") target = 0.35 + 0.25 * Math.abs(Math.sin(t * 11));
    else if (state === "thinking") target = 0.3;
    else target = 0.12 + 0.05 * Math.sin(t * 1.4);
    bump *= 0.9;
    level += (target + bump - level) * 0.12;
    const tint = state === "speaking" ? EMBER : ICE;

    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = "round";

    // Outer tick ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.04 * speed);
    for (let i = 0; i < 120; i++) {
      const a = (i / 120) * Math.PI * 2;
      const long = i % 10 === 0;
      const r1 = R * (long ? 0.9 : 0.94), r2 = R * 0.98;
      ctx.strokeStyle = `rgba(${ICE},${long ? 0.7 : 0.25})`;
      ctx.lineWidth = Math.max(1, R * (long ? 0.008 : 0.004));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.restore();

    // Segmented arcs
    ctx.save();
    ctx.translate(cx, cy);
    const spin = state === "thinking" ? 2.4 : 0.35;
    ctx.rotate(-t * spin * speed);
    ctx.lineWidth = R * 0.03;
    for (let k = 0; k < 3; k++) {
      const start = k * (Math.PI * 2 / 3);
      ctx.strokeStyle = `rgba(${tint},${0.55 + 0.3 * level})`;
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.8, start, start + Math.PI * 0.42);
      ctx.stroke();
    }
    ctx.restore();

    // Thin dashed ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.2 * speed);
    ctx.setLineDash([R * 0.02, R * 0.03]);
    ctx.strokeStyle = `rgba(${ICE},0.35)`;
    ctx.lineWidth = Math.max(1, R * 0.006);
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Voice bars
    const bars = 72;
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = 0; i < bars; i++) {
      const a = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const wave = 0.5 + 0.5 * Math.sin(i * 0.9 + t * 6 * speed) * Math.cos(i * 0.37 - t * 3.1 * speed);
      const len = R * (0.03 + 0.17 * level * wave);
      const r1 = R * 0.46, r2 = r1 + len;
      ctx.strokeStyle = `rgba(${tint},${0.35 + 0.6 * level * wave})`;
      ctx.lineWidth = Math.max(1, R * 0.012);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.restore();

    // Core glow
    const pulse = 1 + 0.05 * level * Math.sin(t * 5);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.42 * pulse);
    g.addColorStop(0, `rgba(${tint},${0.22 + 0.25 * level})`);
    g.addColorStop(0.6, `rgba(${tint},0.06)`);
    g.addColorStop(1, `rgba(${tint},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.42 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(${tint},${0.6 + 0.3 * level})`;
    ctx.lineWidth = Math.max(1, R * 0.01);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.38, 0, Math.PI * 2);
    ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Voice out (speech synthesis) ---------- */
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let voices = [], voiceIdx = 0, soundOn = store.get("jarvis.sound") !== "off";
  els.muteBtn.setAttribute("aria-pressed", String(soundOn));
  function loadVoices() {
    if (!synth) return;
    const all = synth.getVoices();
    const pt = all.filter((v) => /^pt(-|_)?BR/i.test(v.lang));
    const ptAny = all.filter((v) => /^pt/i.test(v.lang));
    voices = pt.length ? pt : ptAny;
    const saved = store.get("jarvis.voice");
    const i = voices.findIndex((v) => v.name === saved);
    voiceIdx = i >= 0 ? i : 0;
    showVoice();
  }
  function showVoice() {
    if (!synth) { els.voiceText.textContent = "Este aparelho não fala"; els.voiceBtn.hidden = true; return; }
    const v = voices[voiceIdx];
    els.voiceText.textContent = !soundOn ? "Sem som" : v ? v.name.replace(/\s*\(.*\)$/, "") : "Voz padrão do aparelho";
    els.voiceBtn.hidden = voices.length < 2;
  }
  if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); }
  else showVoice();

  let speakQueue = 0;
  function cleanForSpeech(s) {
    return s.replace(/[*_`#>|~]/g, "").replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/\s+/g, " ").trim();
  }
  function speak(text) {
    if (!synth || !soundOn) return;
    const clean = cleanForSpeech(text);
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "pt-BR";
    if (voices[voiceIdx]) u.voice = voices[voiceIdx];
    u.rate = 1.02;
    u.pitch = 0.92;
    u.onstart = () => setState("speaking");
    u.onboundary = () => { bump = 0.5; };
    const done = () => { speakQueue = Math.max(0, speakQueue - 1); if (speakQueue === 0 && !busy) setState("idle"); };
    u.onend = done;
    u.onerror = done;
    speakQueue++;
    synth.speak(u);
  }
  function stopSpeaking() {
    if (synth) synth.cancel();
    speakQueue = 0;
  }
  function unlockAudio() {
    // iOS only lets a page speak after a tap; an empty utterance inside the tap unlocks it.
    if (!synth || unlockAudio.done) return;
    unlockAudio.done = true;
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } catch {}
  }

  els.muteBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    store.set("jarvis.sound", soundOn ? "on" : "off");
    els.muteBtn.setAttribute("aria-pressed", String(soundOn));
    if (!soundOn) stopSpeaking();
    showVoice();
  });
  els.voiceBtn.addEventListener("click", () => {
    if (!voices.length) return;
    unlockAudio();
    voiceIdx = (voiceIdx + 1) % voices.length;
    store.set("jarvis.voice", voices[voiceIdx].name);
    showVoice();
    stopSpeaking();
    speak("Assim soa melhor, senhor?");
  });

  /* ---------- Voice in (speech recognition) ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, listening = false, srBroken = !SR;
  function showDictationHint() {
    els.hint.textContent = "Para falar, toque na caixa de texto e use o microfone do teclado do celular.";
    els.hint.hidden = false;
  }
  function startListening() {
    unlockAudio();
    stopSpeaking();
    if (srBroken) { showDictationHint(); els.msg.focus(); return; }
    try {
      recog = new SR();
      recog.lang = "pt-BR";
      recog.interimResults = true;
      recog.continuous = false;
      let finalText = "";
      recog.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
        }
        els.msg.value = (finalText + interim).trim();
        bump = 0.4;
      };
      recog.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
          srBroken = true;
          showDictationHint();
          els.msg.focus();
        }
      };
      recog.onend = () => {
        listening = false;
        els.micBtn.setAttribute("aria-pressed", "false");
        if (state === "listening") setState("idle");
        const text = els.msg.value.trim();
        if (finalText.trim() && text) send(text);
      };
      recog.start();
      listening = true;
      els.micBtn.setAttribute("aria-pressed", "true");
      setState("listening");
    } catch {
      srBroken = true;
      showDictationHint();
      els.msg.focus();
    }
  }
  function stopListening() { try { recog?.stop(); } catch {} }

  els.micBtn.addEventListener("click", () => (listening ? stopListening() : startListening()));
  els.coreHit.addEventListener("click", () => {
    if (state === "speaking" || state === "thinking") { cancelAll(); return; }
    listening ? stopListening() : startListening();
  });

  /* ---------- Calendar (Google Calendar connector) ---------- */
  let mcp = null;
  let agenda = { status: "loading", events: [] };
  const fmtHour = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  function parseEvents(payload) {
    const list = Array.isArray(payload) ? payload : payload?.items || payload?.events || [];
    return list.map((e) => {
      const s = e.start?.dateTime || e.start?.date || e.startTime || "";
      const f = e.end?.dateTime || e.end?.date || e.endTime || "";
      const allDay = !!(e.start?.date && !e.start?.dateTime);
      return {
        titulo: e.summary || e.title || "(sem título)",
        inicio: allDay ? "dia inteiro" : s ? fmtHour.format(new Date(s)) : "",
        fim: allDay ? "" : f ? fmtHour.format(new Date(f)) : "",
        data: s ? isoDay(new Date(allDay ? s + "T12:00:00Z" : s)) : "",
        local: e.location || "",
      };
    });
  }
  function agendaCopy(code) {
    switch (code) {
      case "needs_reauth": return "Reconecte o Google Calendar em Configurações › Conectores no claude.ai.";
      case "server_not_connected": return "Adicione o Google Calendar em Configurações › Conectores no claude.ai.";
      case "selection_required": return "Escolha qual Google Calendar usar no aviso do claude.ai.";
      case "not_in_manifest":
      case "approval_required":
      case "consent_required": return "O painel precisa da sua permissão para ler a agenda.";
      case "blocked_by_policy": return "A sua organização bloqueou a leitura da agenda.";
      case "server_unavailable": return "O Google Calendar não respondeu agora.";
      default: return "Não consegui ler a agenda agora.";
    }
  }
  function renderAgenda() {
    const a = agenda;
    els.agendaBtn.hidden = !(a.status === "error" && a.retry);
    if (a.status === "loading") { els.agendaText.textContent = "Consultando o Google Calendar…"; return; }
    if (a.status === "none") { els.agendaText.textContent = "Agenda indisponível aqui"; return; }
    if (a.status === "error") { els.agendaText.textContent = a.message; els.agendaText.title = a.message; return; }
    if (!a.events.length) { els.agendaText.textContent = "Nenhum compromisso hoje"; return; }
    const first = a.events[0];
    const more = a.events.length > 1 ? ` · +${a.events.length - 1}` : "";
    els.agendaText.textContent = `${first.inicio} ${first.titulo}${more}`;
    els.agendaText.title = a.events.map((e) => `${e.inicio} ${e.titulo}`).join("\n");
  }
  async function fetchEvents(startIso, endIso) {
    const r = await mcp.callTool("Google Calendar", "list_events", {
      startTime: startIso + "T00:00:00",
      endTime: endIso + "T00:00:00",
      timeZone: TZ,
      orderBy: "startTime",
      pageSize: 50,
    });
    return parseEvents(r.payload);
  }
  async function loadAgenda() {
    if (!mcp) { agenda = { status: "none", events: [] }; renderAgenda(); return; }
    agenda = { status: "loading", events: [] };
    renderAgenda();
    const today = isoDay(new Date());
    try {
      agenda = { status: "ok", events: await fetchEvents(today, addDays(today, 1)), day: today };
    } catch (e) {
      const code = e?.code || "upstream_error";
      const retry = ["not_in_manifest", "approval_required", "consent_required", "server_unavailable", "upstream_error"].includes(code);
      agenda = { status: "error", events: [], message: agendaCopy(code), retry };
    }
    renderAgenda();
  }
  els.agendaBtn.addEventListener("click", loadAgenda);
  (async () => {
    try { mcp = await window.claude?.use?.("mcp"); } catch { mcp = null; }
    loadAgenda();
  })();
  function agendaForPrompt() {
    if (agenda.status === "ok") {
      if (!agenda.events.length) return "Nenhum compromisso hoje.";
      return agenda.events.map((e) => `- ${e.inicio}${e.fim ? "–" + e.fim : ""} ${e.titulo}${e.local ? " (" + e.local + ")" : ""}`).join("\n");
    }
    if (agenda.status === "loading") return "Ainda carregando; use a ferramenta de agenda se precisar.";
    return "Não foi possível ler a agenda: " + (agenda.message || "indisponível neste painel") + ".";
  }

  /* ---------- Conversation (Claude via sample) ---------- */
  let sample = null, tools = null, busy = false, ctl = null, lastReply = els.replyLine.textContent;
  const turns = [];
  (async () => {
    try { sample = await window.claude?.use?.("sample"); } catch { sample = null; }
    if (!sample) {
      els.replyLine.textContent = "Senhor, este painel só conversa quando aberto pelo claude.ai. Abra o link por lá e eu estarei aqui.";
      return;
    }
    try { tools = (await sample.limits())?.tools ? true : false; } catch { tools = false; }
  })();

  function rules() {
    return [
      "Você é o JARVIS, o assistente pessoal do usuário, falando com ele por voz no celular, como o assistente do Homem de Ferro.",
      "Regras:",
      "- Chame-o sempre de \"senhor\".",
      "- Fale em português do Brasil, com calma, elegância e um humor seco.",
      "- No máximo três frases por resposta, sempre começando pelo que importa.",
      "- A resposta será lida em voz alta: nada de markdown, listas, emojis, links ou símbolos. Escreva horários como se falasse (\"às duas da tarde\").",
      "- Se ele disser \"bom dia\", responda nesta ordem: a hora, o tempo em Curitiba, os compromissos de hoje e os e-mails que precisam de resposta.",
      "- Neste painel você não tem acesso à previsão do tempo nem ao e-mail. Quando forem pedidos, diga isso em poucas palavras, sem inventar, e siga adiante.",
      "- Se ele pedir para responder alguém, escreva o rascunho e avise que está pronto. Você não consegue enviar nada daqui, e nunca diga que enviou. Nada é enviado sem a confirmação dele.",
      "- Nunca invente compromissos, números ou fatos. Se não souber, diga.",
      tools ? "- Para compromissos de outros dias, use a ferramenta agenda_periodo." : "",
      "",
      "Contexto agora:",
      `- Data e hora em Curitiba: ${fmtFull.format(new Date())}.`,
      "- Agenda de hoje (Google Calendar):",
      agendaForPrompt(),
    ].filter(Boolean).join("\n");
  }

  const pageTools = [{
    name: "agenda_periodo",
    description: "Lista os compromissos do Google Calendar do senhor entre duas datas (fuso de Curitiba). Retorna uma lista de {titulo, data, inicio, fim, local}. Use para perguntas sobre amanhã, a semana etc.",
    inputSchema: {
      type: "object",
      properties: {
        inicio: { type: "string", description: "Primeiro dia, AAAA-MM-DD" },
        fim: { type: "string", description: "Último dia incluído, AAAA-MM-DD" },
      },
      required: ["inicio", "fim"],
    },
    async execute(input) {
      if (!mcp) throw new Error("A agenda não está disponível neste painel.");
      const ini = String(input.inicio || "").slice(0, 10);
      const fim = String(input.fim || ini).slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ini) || !/^\d{4}-\d{2}-\d{2}$/.test(fim)) throw new Error("Datas devem estar no formato AAAA-MM-DD.");
      try { return await fetchEvents(ini, addDays(fim, 1)); }
      catch (e) { throw new Error(agendaCopy(e?.code)); }
    },
  }];

  function sampleCopy(code) {
    switch (code) {
      case "not_granted": return "Senhor, preciso da sua permissão para pensar por aqui. Recarregue o painel e aceite o pedido do claude.ai.";
      case "sampling_disabled": return "O Claude não está disponível para esta conta.";
      case "rate_limited": return "Muitas perguntas seguidas, senhor. Dê-me um momento e tente de novo.";
      case "session_expired": return "A sessão expirou. Entre de novo no claude.ai, senhor.";
      case "refused": return "Prefiro não responder a isso, senhor. Tente de outra forma.";
      case "prompt_too_large": return "A conversa ficou longa demais. Recarregue o painel para recomeçar.";
      default: return "Perdi a conexão por um instante, senhor. Tente de novo.";
    }
  }

  // Speak sentence by sentence as the answer streams in.
  let spokenUpTo = 0;
  function speakNewSentences(text, final) {
    const rest = text.slice(spokenUpTo);
    if (final) { if (rest.trim()) speak(rest); spokenUpTo = text.length; return; }
    const re = /[^.!?…]*[.!?…]+["”)]?\s+/g;
    let m, end = 0;
    while ((m = re.exec(rest))) end = m.index + m[0].length;
    if (end > 0) { speak(rest.slice(0, end)); spokenUpTo += end; }
  }

  function cancelAll() {
    ctl?.abort();
    stopSpeaking();
    stopListening();
    if (!busy) setState("idle");
  }
  els.stopBtn.addEventListener("click", cancelAll);

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    unlockAudio();
    stopSpeaking();
    els.msg.value = "";
    els.youLine.textContent = text;
    els.youLine.hidden = false;
    if (!sample) {
      els.replyLine.className = "reply error";
      els.replyLine.textContent = "Senhor, este painel só conversa quando aberto pelo claude.ai.";
      return;
    }
    busy = true;
    els.sendBtn.disabled = true;
    setState("thinking");
    els.replyLine.className = "reply thinking";
    els.replyLine.textContent = "Pensando…";
    spokenUpTo = 0;
    ctl = new AbortController();
    turns.push({ role: "user", content: text });
    while (turns.length > 16) turns.shift();
    while (turns.length && turns[0].role !== "user") turns.shift();
    const opts = {
      signal: ctl.signal,
      modelTier: "quick",
      onText: ({ text: t }) => {
        els.replyLine.className = "reply";
        els.replyLine.textContent = t;
        els.log.scrollTop = els.log.scrollHeight;
        speakNewSentences(t, false);
      },
    };
    if (tools) opts.tools = pageTools; else opts.cache = false;
    try {
      const { text: answer } = await sample([{ role: "user", content: rules() }, ...turns], opts);
      lastReply = answer;
      els.replyLine.className = "reply";
      els.replyLine.textContent = answer;
      turns.push({ role: "assistant", content: answer });
      speakNewSentences(answer, true);
    } catch (e) {
      turns.pop();
      if (e?.code === "cancelled") {
        els.replyLine.className = "reply";
        els.replyLine.textContent = e.text || "Como quiser, senhor.";
      } else if (e?.code === "refused") {
        els.replyLine.className = "reply error";
        els.replyLine.textContent = sampleCopy(e.code);
      } else {
        els.replyLine.className = "reply error";
        els.replyLine.textContent = (e?.text ? e.text + " " : "") + sampleCopy(e?.code);
      }
    } finally {
      busy = false;
      els.sendBtn.disabled = false;
      if (speakQueue === 0) setState("idle");
    }
  }

  els.bar.addEventListener("submit", (e) => { e.preventDefault(); send(els.msg.value); });

  els.copyBtn.addEventListener("click", async () => {
    const text = lastReply || els.replyLine.textContent;
    try {
      await navigator.clipboard.writeText(text);
      els.copyBtn.textContent = "Copiado";
    } catch {
      const r = document.createRange();
      r.selectNodeContents(els.replyLine);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      els.copyBtn.textContent = "Selecionado";
    }
    setTimeout(() => (els.copyBtn.textContent = "Copiar resposta"), 1600);
  });
})();
</script>
